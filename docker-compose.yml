# Passport OCR: API (FastAPI + PaddleOCR) + Ollama (Qwen3-VL).
#
#   Con su propio Ollama (GPU NVIDIA):   docker compose --profile ollama up -d --build
#   Compartiendo el Ollama de ine-ocr:   docker compose up -d --build   (VLM_BASE_URL=http://ollama:11434 y
#                                        OLLAMA_NETWORK=ine-ocr_default en .env; ver README)
#
# La API queda en http://SERVIDOR:18474 (cambiar con API_PORT en .env).

name: passport-ocr

services:
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: "24h"
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_FLASH_ATTENTION: ${OLLAMA_FLASH_ATTENTION:-1}
      OLLAMA_KV_CACHE_TYPE: ${OLLAMA_KV_CACHE_TYPE:-q8_0}
    volumes:
      - ollama-models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30

  ollama-pull:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: "ollama:11434"
    entrypoint: ["ollama", "pull", "${VLM_MODEL:-qwen3-vl:8b-instruct}"]
    restart: "no"

  api:
    build: .
    image: passport-ocr-api:latest
    restart: unless-stopped
    ports:
      - "${API_PORT:-18474}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      VLM_BACKEND: ${VLM_BACKEND:-ollama}
      VLM_BASE_URL: ${VLM_BASE_URL:-http://ollama:11434}
      VLM_MODEL: ${VLM_MODEL:-qwen3-vl:8b-instruct}
    networks:
      - default
      - vlm

  # Procesamiento por lote (pruebas): docker compose run --rm lote lote/pdfs --salida lote/resultados
  lote:
    image: passport-ocr-api:latest
    profiles: ["lote"]
    env_file:
      - path: .env
        required: false
    environment:
      VLM_BACKEND: ${VLM_BACKEND:-ollama}
      VLM_BASE_URL: ${VLM_BASE_URL:-http://ollama:11434}
      VLM_MODEL: ${VLM_MODEL:-qwen3-vl:8b-instruct}
    volumes:
      - ${LOTE_DIR:-./lote}:/app/lote
    networks:
      - default
      - vlm
    entrypoint: ["python", "-m", "scripts.procesar_lote"]
    restart: "no"

networks:
  # Red donde vive el Ollama que se usa. Con el perfil "ollama" es la red propia del proyecto;
  # para compartir el Ollama de otro proyecto, OLLAMA_NETWORK=<nombre de su red> en .env.
  vlm:
    name: ${OLLAMA_NETWORK:-passport-ocr_default}
    external: ${OLLAMA_NETWORK_EXTERNAL:-false}

volumes:
  ollama-models:
